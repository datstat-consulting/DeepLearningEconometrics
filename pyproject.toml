[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DeepLearningEconometrics"
version = "1.1.0"
requires-python = ">=3.10"
authors = [{ name = "Adriel Ong", email = "adriel_datstat@zohomail.com" }, {name = "Azriel Cais Baluyut"}, {name = "Jowi Rapha Cruz"}]
description = "Implementing standard econometric models using Stochastic Gradient Descent and Perceptrons instead of MLE and GMM."
readme = "README.md"
license = { file="LICENSE" }
dependencies = [
    "pandas", 
    "plotly", 
    "matplotlib",
    "numpy",
    "scipy",
    "torch"
]

[tool.setuptools]
packages = ["DeepLearningEconometrics"]

[tool.setuptools.package-dir]
DeepLearningEconometrics = "."
